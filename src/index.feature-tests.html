<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Angular Books</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse two million Goodreads books with Angular SSR, server-rendered search, and URL-driven filters.">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta property="og:description" content="Browse two million Goodreads books with Angular SSR, server-rendered search, and URL-driven filters.">
  <meta property="og:site_name" content="Angular Books">
  <meta property="og:title" content="Angular Books">
  <meta property="og:type" content="website">
  <!-- Feature test (font-optimization): Google Fonts link that optimization.fonts.inline inlines at build. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&display=swap">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>(function(){try{var t=localStorage.getItem("theme");var d=t==="dark"||((t==="system"||!t)&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})();</script>
</head>
<body class="bg-surface text-black antialiased dark:bg-surface-dark dark:text-white">
  <app-root></app-root>
</body>
</html>
